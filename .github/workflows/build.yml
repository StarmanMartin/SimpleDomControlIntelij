name: Build plugin

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # PyCharm 2026.2 runs JBR 25; the IntelliJ Platform Gradle plugin targets that JVM.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      # Caches Gradle and the downloaded PyCharm platform (~1 GB) between runs.
      - uses: gradle/actions/setup-gradle@v4

      - name: Build plugin zip
        run: ./gradlew buildPlugin

      - name: Upload plugin zip
        uses: actions/upload-artifact@v4
        with:
          name: SimpleDomControlIntelij
          path: build/distributions/*.zip
          if-no-files-found: error

  release:
    # Pushing a tag like v0.1.0 attaches the zip to a GitHub release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SimpleDomControlIntelij
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
          body: |
            ## Install
            1. Download `SimpleDomControlIntelij-*.zip` below (do not unpack it).
            2. In PyCharm (2026.2 or newer): **Settings → Plugins → ⚙ → Install Plugin from Disk…** and pick the zip.
            3. Restart the IDE; the **SDC** tool window appears on the left.
